# Roda tudo no seu computador, igual à nuvem: docker compose up --build
# Depois abra http://localhost:5000 (o código de acesso é gerado na 1ª vez: docker compose logs app | grep Código).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthpool
    ports:
      - "5433:5432" # 5433 para não brigar com o banco do healthPool original (5432)
    volumes:
      - asseit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthpool"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/healthpool?schema=asseit
      ACCESS_KEY_FILE: /data/access-key # gerado aleatoriamente e mantido entre reinícios
      PORT: "5000"
    ports:
      - "5000:5000"
    volumes:
      - asseit_access:/data

volumes:
  asseit_pgdata:
  asseit_access:
